          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          STREAMHUB_EOF
          cat > settings.gradle <<'STREAMHUB_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StreamHub"
          include ':app'
          STREAMHUB_EOF

      - name: Build the app
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Publish StreamHub.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk StreamHub.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          sleep 3
          gh release create latest StreamHub.apk --repo "$GITHUB_REPOSITORY" \
            --title "StreamHub" --notes "Install StreamHub.apk on your Fire Stick, Android box or phone."

      - name: Save the error log so it can be checked
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build-log.txt
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.name "StreamHub build"
          git config user.email "build@users.noreply.github.com"
          grep -nE "error:|FAILED|What went wrong|Exception|e: " "$GITHUB_WORKSPACE/build-log.txt" | head -300 > errors.txt || true
          tail -c 300000 "$GITHUB_WORKSPACE/build-log.txt" > build-log.txt
          git add . && git commit -qm "Build log $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/build-log
