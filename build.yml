          package com.dil.streamhub;

          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.view.View;
          import android.widget.Button;

          /** Shared look for all StreamHub screens. */
          final class Ui {
              static final int BG = 0xFF0E0E12;
              static final int SURFACE = 0xFF1C1C24;
              static final int FIELD = 0xFF22222A;
              static final int BUTTON = 0xFF2A2A33;
              static final int ACCENT = 0xFF8E44D0;
              static final int MUTED = 0xFFA0A0AA;
              static final int FAINT = 0xFF808088;

              private Ui() {}

              static boolean isTv(Context c) {
                  UiModeManager ui = (UiModeManager) c.getSystemService(Context.UI_MODE_SERVICE);
                  return ui != null && ui.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
              }

              static int dp(Context c, float v) {
                  return Math.round(v * c.getResources().getDisplayMetrics().density);
              }

              static StateListDrawable states(Context c, int color, float radiusDp) {
                  GradientDrawable normal = new GradientDrawable();
                  normal.setColor(color);
                  normal.setCornerRadius(dp(c, radiusDp));
                  GradientDrawable focused = new GradientDrawable();
                  focused.setColor(color);
                  focused.setCornerRadius(dp(c, radiusDp));
                  focused.setStroke(dp(c, 3), Color.WHITE);
                  StateListDrawable s = new StateListDrawable();
                  s.addState(new int[]{android.R.attr.state_focused}, focused);
                  s.addState(new int[]{android.R.attr.state_pressed}, focused);
                  s.addState(new int[]{}, normal);
                  return s;
              }

              static GradientDrawable solid(Context c, int color, float radiusDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(c, radiusDp));
                  return d;
              }

              static void grow(View v, float scale) {
                  v.setOnFocusChangeListener((view, has) ->
                      view.animate().scaleX(has ? scale : 1f).scaleY(has ? scale : 1f).setDuration(120).start());
              }

              static Button button(Context c, String text) {
                  Button b = new Button(c);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(16);
                  b.setBackground(states(c, BUTTON, 12));
                  b.setPadding(dp(c, 18), dp(c, 10), dp(c, 18), dp(c, 10));
                  grow(b, 1.05f);
                  return b;
              }
          }
