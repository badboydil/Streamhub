          /** Where the user types the IPTV login their provider gave them. Stored only on this device. */
          public class LoginActivity extends Activity {

              private EditText server, user, pass;
              private CheckBox hls;
              private TextView status;
              private Button save;
              private boolean tv;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tv = Ui.isTv(this);
                  int pad = tv ? Ui.dp(this, 48) : Ui.dp(this, 18);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Ui.BG);
                  scroll.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("IPTV login");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(tv ? 30 : 26);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView help = new TextView(this);
                  help.setText("Enter the Xtream Codes login from your IPTV provider. If you only have a username and "
                      + "password for MUK XC, ask your provider for “the server address for other apps like TiviMate”. "
                      + "You can also paste a full M3U link into the server box and the rest fills in by itself.\n\n"
                      + "Your login is saved only on this device.");
                  help.setTextColor(Ui.MUTED);
                  help.setTextSize(15);
                  help.setPadding(0, Ui.dp(this, 6), 0, Ui.dp(this, 16));
                  root.addView(help);

                  server = field(root, "Server address", "http://example.com:8080", InputType.TYPE_TEXT_VARIATION_URI);
                  user = field(root, "Username", "", InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD);
                  pass = field(root, "Password", "", InputType.TYPE_TEXT_VARIATION_PASSWORD);

                  hls = new CheckBox(this);
                  hls.setText("Play live channels as HLS (.m3u8). Try this if channels won't play.");
                  hls.setTextColor(Color.WHITE);
                  hls.setTextSize(15);
                  hls.setPadding(Ui.dp(this, 6), Ui.dp(this, 10), 0, Ui.dp(this, 10));
                  root.addView(hls);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  buttons.setPadding(0, Ui.dp(this, 12), 0, 0);
                  root.addView(buttons);

                  save = Ui.button(this, "Check & save");
                  save.setBackground(Ui.states(this, Ui.ACCENT, 12));
                  Button signOut = Ui.button(this, "Sign out");
                  Button done = Ui.button(this, "Done");
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.rightMargin = Ui.dp(this, 10);
                  buttons.addView(save, lp);
                  buttons.addView(signOut, new LinearLayout.LayoutParams(lp));
                  buttons.addView(done, new LinearLayout.LayoutParams(lp));

                  status = new TextView(this);
                  status.setTextColor(Color.WHITE);
                  status.setTextSize(16);
                  status.setPadding(0, Ui.dp(this, 16), 0, 0);
                  root.addView(status);

                  Xtream saved = Xtream.fromPrefs(this);
                  if (saved != null) {
                      server.setText(saved.server);
                      user.setText(saved.user);
                      pass.setText(saved.pass);
                      hls.setChecked(saved.hls);
                      status.setText("You're signed in. Change the details and press Check & save to update them.");
                  }

                  save.setOnClickListener(v -> check());
                  signOut.setOnClickListener(v -> {
                      Xtream.signOut(this);
                      server.setText("");
                      user.setText("");
                      pass.setText("");
                      hls.setChecked(false);
                      status.setText("Signed out. Live TV opens your MUK XC app again.");
                  });
