          package com.dil.streamhub;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.util.Base64;
          import android.util.JsonReader;
          import android.util.JsonToken;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.ConnectException;
          import java.net.HttpURLConnection;
          import java.net.SocketTimeoutException;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.net.UnknownHostException;
          import java.nio.charset.StandardCharsets;
          import java.text.DateFormat;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          /** Talks to an Xtream Codes IPTV server using the subscriber's own login. */
          public class Xtream {

              public static final String UA = "StreamHub/2.0 (Linux; Android)";
              public static final String LIVE = "live", MOVIE = "movie", SERIES = "series";
              private static final String PREFS = "iptv";

              public static class Category {
                  public final String id, name;
                  public Category(String id, String name) { this.id = id; this.name = name; }
              }

              public static class Item {
                  public String id = "", name = "", icon = "", ext = "", categoryId = "", kind = "", epgId = "";

                  public String key() { return kind + "\t" + id + "\t"; }

                  String serialize() {
                      return kind + "\t" + id + "\t" + clean(name) + "\t" + clean(icon) + "\t" + clean(ext);
                  }

                  static Item parse(String s) {
                      String[] p = s.split("\t", -1);
                      if (p.length < 5) return null;
                      Item i = new Item();
                      i.kind = p[0]; i.id = p[1]; i.name = p[2]; i.icon = p[3]; i.ext = p[4];
                      return i;
                  }

                  private static String clean(String s) {
                      return s == null ? "" : s.replace('\t', ' ').replace('\n', ' ');
                  }
              }

              public static class Episode {
                  public String id = "", title = "", ext = "", season = "1";
                  public int num;
              }

              public static class Account {
                  public boolean ok;
                  public String status = "", expires = "", maxConn = "", message = "";
              }

              private static final Map<String, List<Item>> CACHE = Collections.synchronizedMap(new HashMap<String, List<Item>>());

              public final String server, user, pass;
              public final boolean hls;

              public Xtream(String server, String user, String pass, boolean hls) {
                  this.server = normalize(server);
                  this.user = user == null ? "" : user.trim();
                  this.pass = pass == null ? "" : pass.trim();
                  this.hls = hls;
              }

              // ---------- saved login ----------

              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static Xtream fromPrefs(Context c) {
                  SharedPreferences p = prefs(c);
                  String s = p.getString("server", ""), u = p.getString("user", "");
                  if (s.isEmpty() || u.isEmpty()) return null;
                  return new Xtream(s, u, p.getString("pass", ""), p.getBoolean("hls", false));
              }

              public void save(Context c) {
                  prefs(c).edit().putString("server", server).putString("user", user)
                      .putString("pass", pass).putBoolean("hls", hls).apply();
                  CACHE.clear();
              }

              public static void signOut(Context c) {
                  prefs(c).edit().remove("server").remove("user").remove("pass").remove("hls").apply();
                  CACHE.clear();
              }

              public static String normalize(String s) {
                  s = s == null ? "" : s.trim();
                  int q = s.indexOf("/player_api.php");
                  if (q > 0) s = s.substring(0, q);
                  q = s.indexOf("/get.php");
                  if (q > 0) s = s.substring(0, q);
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  if (!s.isEmpty() && !s.startsWith("http://") && !s.startsWith("https://")) s = "http://" + s;
                  return s;
              }

              // ---------- favourites ----------

              private static Set<String> favRaw(Context c) {
                  return new HashSet<>(prefs(c).getStringSet("favs", new HashSet<String>()));
              }

              public static Set<String> favKeys(Context c) {
                  Set<String> out = new HashSet<>();
                  for (String s : favRaw(c)) {
                      Item i = Item.parse(s);
                      if (i != null) out.add(i.key());
                  }
                  return out;
              }

              public static List<Item> favourites(Context c, String kind) {
                  List<Item> out = new ArrayList<>();
                  for (String s : favRaw(c)) {
                      Item i = Item.parse(s);
                      if (i != null && i.kind.equals(kind)) out.add(i);
                  }
                  Collections.sort(out, (a, b) -> a.name.compareToIgnoreCase(b.name));
                  return out;
              }

              /** Returns true if the item is now a favourite. */
              public static boolean toggleFav(Context c, Item item) {
                  Set<String> s = favRaw(c);
                  boolean removed = false;
                  Iterator<String> it = s.iterator();
                  while (it.hasNext()) {
                      if (it.next().startsWith(item.key())) { it.remove(); removed = true; }
                  }
                  if (!removed) s.add(item.serialize());
                  prefs(c).edit().putStringSet("favs", s).apply();
                  return !removed;
              }

              // ---------- network ----------

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              private String apiUrl(String action, String extra) {
                  StringBuilder b = new StringBuilder(server)
                      .append("/player_api.php?username=").append(enc(user))
                      .append("&password=").append(enc(pass));
                  if (action != null) b.append("&action=").append(action);
                  if (extra != null) b.append(extra);
                  return b.toString();
              }

              private static HttpURLConnection connect(String url) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(60000);
                  c.setRequestProperty("User-Agent", UA);
                  c.setInstanceFollowRedirects(true);
                  int code = c.getResponseCode();
                  if (code >= 400) {
                      c.disconnect();
                      throw new IOException("The server answered with error " + code + ".");
                  }
                  return c;
              }

              private static String readAll(String url) throws IOException {
                  HttpURLConnection c = connect(url);
                  try {
                      InputStream in = new BufferedInputStream(c.getInputStream());
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                      in.close();
                      return new String(o.toByteArray(), StandardCharsets.UTF_8);
                  } finally {
                      c.disconnect();
                  }
              }

              public static String friendly(Exception e) {
                  if (e instanceof UnknownHostException) return "Can't find that server. Check the address.";
                  if (e instanceof SocketTimeoutException) return "The server took too long to answer. Try again, or check the address and port.";
                  if (e instanceof ConnectException) return "Couldn't connect. Check the address and the port (for example :8080).";
                  if (e instanceof javax.net.ssl.SSLException) return "Secure connection failed. Try http:// instead of https://.";
                  String m = e.getMessage();
                  return m == null || m.isEmpty() ? "Something went wrong talking to the server." : m;
              }

              // ---------- API ----------

              public Account login() throws Exception {
                  Account a = new Account();
                  String body = readAll(apiUrl(null, null)).trim();
                  if (!body.startsWith("{")) {
                      a.message = "Wrong username or password, or this isn't an Xtream Codes server address.";
                      return a;
                  }
                  JSONObject o = new JSONObject(body);
                  JSONObject ui = o.optJSONObject("user_info");
                  if (ui == null || ui.optInt("auth", 0) != 1) {
                      a.message = "Wrong username or password.";
                      return a;
                  }
                  a.status = ui.optString("status", "");
                  String exp = ui.optString("exp_date", "");
                  if (!exp.isEmpty() && !exp.equals("null")) {
                      try {
                          a.expires = DateFormat.getDateInstance().format(new Date(Long.parseLong(exp) * 1000L));
                      } catch (Exception ignored) {}
                  }
                  a.maxConn = ui.optString("max_connections", "");
                  a.ok = true;
                  return a;
              }

              public List<Category> categories(String kind) throws Exception {
                  String action = kind.equals(LIVE) ? "get_live_categories"
                      : kind.equals(MOVIE) ? "get_vod_categories" : "get_series_categories";
                  String body = readAll(apiUrl(action, null)).trim();
                  List<Category> out = new ArrayList<>();
                  if (!body.startsWith("[")) return out;
                  JSONArray a = new JSONArray(body);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) continue;
                      out.add(new Category(o.optString("category_id", ""), o.optString("category_name", "").trim()));
                  }
                  return out;
              }

              /** categoryId null = everything of this kind. Results are cached for the session. */
              public List<Item> items(String kind, String categoryId) throws Exception {
                  String key = kind + "|" + (categoryId == null ? "*" : categoryId);
                  List<Item> cached = CACHE.get(key);
                  if (cached != null) return cached;

                  if (categoryId != null) {
                      List<Item> all = CACHE.get(kind + "|*");
                      if (all != null) {
                          List<Item> out = new ArrayList<>();
                          for (Item i : all) if (categoryId.equals(i.categoryId)) out.add(i);
                          CACHE.put(key, out);
                          return out;
                      }
                  }

                  String action = kind.equals(LIVE) ? "get_live_streams"
                      : kind.equals(MOVIE) ? "get_vod_streams" : "get_series";
                  String extra = categoryId == null ? null : "&category_id=" + enc(categoryId);
                  HttpURLConnection conn = connect(apiUrl(action, extra));
                  List<Item> out = new ArrayList<>();
                  JsonReader r = null;
                  try {
                      r = new JsonReader(new InputStreamReader(new BufferedInputStream(conn.getInputStream()), StandardCharsets.UTF_8));
                      r.setLenient(true);
                      if (r.peek() != JsonToken.BEGIN_ARRAY) {
                          r.skipValue();
                      } else {
                          r.beginArray();
                          while (r.hasNext()) {
                              if (r.peek() != JsonToken.BEGIN_OBJECT) { r.skipValue(); continue; }
                              Item it = new Item();
                              it.kind = kind;
                              r.beginObject();
                              while (r.hasNext()) {
                                  String f = r.nextName();
                                  switch (f) {
                                      case "name": it.name = str(r).trim(); break;
                                      case "stream_id":
                                          if (!kind.equals(SERIES)) it.id = str(r); else r.skipValue();
                                          break;
                                      case "series_id":
                                          if (kind.equals(SERIES)) it.id = str(r); else r.skipValue();
                                          break;
                                      case "stream_icon":
                                      case "cover": {
                                          String v = str(r);
                                          if (!v.isEmpty()) it.icon = v;
                                          break;
                                      }
                                      case "category_id": it.categoryId = str(r); break;
                                      case "container_extension": it.ext = str(r); break;
                                      case "epg_channel_id": it.epgId = str(r); break;
                                      default: r.skipValue();
                                  }
                              }
                              r.endObject();
                              if (!it.id.isEmpty()) out.add(it);
                          }
                          r.endArray();
                      }
                  } finally {
                      try { if (r != null) r.close(); } catch (Exception ignored) {}
                      conn.disconnect();
                  }
                  CACHE.put(key, out);
                  return out;
              }

              private static String str(JsonReader r) throws IOException {
                  JsonToken t = r.peek();
                  switch (t) {
                      case NULL: r.nextNull(); return "";
                      case STRING:
                      case NUMBER: return r.nextString();
                      case BOOLEAN: return String.valueOf(r.nextBoolean());
                      default: r.skipValue(); return "";
                  }
              }

              private static int num(String s) {
                  try { return Integer.parseInt(s.trim()); } catch (Exception e) { return 9999; }
              }

              public LinkedHashMap<String, List<Episode>> seasons(String seriesId) throws Exception {
                  String body = readAll(apiUrl("get_series_info", "&series_id=" + enc(seriesId))).trim();
                  LinkedHashMap<String, List<Episode>> out = new LinkedHashMap<>();
                  if (!body.startsWith("{")) return out;
                  JSONObject o = new JSONObject(body);
                  Object eps = o.opt("episodes");
                  if (eps instanceof JSONObject) {
                      JSONObject e = (JSONObject) eps;
                      List<String> keys = new ArrayList<>();
                      Iterator<String> it = e.keys();
                      while (it.hasNext()) keys.add(it.next());
                      Collections.sort(keys, (a, b) -> Integer.compare(num(a), num(b)));
                      for (String k : keys) addEpisodes(out, k, e.optJSONArray(k));
                  } else if (eps instanceof JSONArray) {
                      JSONArray arr = (JSONArray) eps;
                      for (int i = 0; i < arr.length(); i++) addEpisodes(out, null, arr.optJSONArray(i));
                  }
                  for (List<Episode> l : out.values()) Collections.sort(l, (a, b) -> Integer.compare(a.num, b.num));
                  return out;
              }

              private static void addEpisodes(Map<String, List<Episode>> out, String seasonKey, JSONArray arr) {
                  if (arr == null) return;
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject e = arr.optJSONObject(i);
                      if (e == null) continue;
                      Episode ep = new Episode();
                      ep.id = e.optString("id", "");
                      if (ep.id.isEmpty()) continue;
                      ep.ext = e.optString("container_extension", "mp4");
                      ep.num = e.optInt("episode_num", i + 1);
                      ep.season = seasonKey != null ? seasonKey : e.optString("season", "1");
                      ep.title = e.optString("title", "");
                      List<Episode> l = out.get(ep.season);
                      if (l == null) { l = new ArrayList<>(); out.put(ep.season, l); }
                      l.add(ep);
                  }
              }

              /** "Now: 18:00 News   Next: 18:30 Weather", or "" if the server has no guide. */
              public String nowNext(String streamId) {
                  try {
                      String body = readAll(apiUrl("get_short_epg", "&stream_id=" + enc(streamId) + "&limit=2")).trim();
                      if (!body.startsWith("{")) return "";
                      JSONArray l = new JSONObject(body).optJSONArray("epg_listings");
                      if (l == null || l.length() == 0) return "";
                      SimpleDateFormat f = new SimpleDateFormat("HH:mm", Locale.getDefault());
                      StringBuilder b = new StringBuilder();
                      for (int i = 0; i < Math.min(2, l.length()); i++) {
                          JSONObject e = l.optJSONObject(i);
                          if (e == null) continue;
                          long start = e.optLong("start_timestamp", 0) * 1000L;
                          b.append(i == 0 ? "Now: " : "     Next: ");
                          if (start > 0) b.append(f.format(new Date(start))).append("  ");
                          b.append(b64(e.optString("title", "")));
                      }
                      return b.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static String b64(String s) {
                  try {
                      return new String(Base64.decode(s, Base64.DEFAULT), StandardCharsets.UTF_8).trim();
                  } catch (Exception e) {
                      return s;
                  }
              }

              // ---------- playback addresses ----------

              private String auth() {
                  return Uri.encode(user) + "/" + Uri.encode(pass) + "/";
              }

              public String liveUrl(Item i) {
                  return server + "/live/" + auth() + i.id + (hls ? ".m3u8" : ".ts");
              }

              public String movieUrl(Item i) {
                  return server + "/movie/" + auth() + i.id + "." + (i.ext.isEmpty() ? "mp4" : i.ext);
              }

              public String episodeUrl(Episode e) {
                  return server + "/series/" + auth() + e.id + "." + (e.ext.isEmpty() ? "mp4" : e.ext);
              }
          }
