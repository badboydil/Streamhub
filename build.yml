          package com.dil.streamhub;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.AdapterView;
          import android.widget.BaseAdapter;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Browse and search the subscriber's live channels, movies or series. */
          public class IptvActivity extends Activity {

              public static final String EXTRA_KIND = "kind";
              public static final String EXTRA_QUERY = "query";

              private static final String FAV = "\u0001fav";
              private static final String ALL = "\u0001all";

              private Xtream x;
              private String kind;
              private boolean tv;

              private static final ExecutorService bg = Executors.newSingleThreadExecutor();
              private static final ExecutorService epgPool = Executors.newSingleThreadExecutor();
              private final Handler main = new Handler(Looper.getMainLooper());

              private final List<Xtream.Category> cats = new ArrayList<>();
              private List<Xtream.Item> shown = new ArrayList<>();
              private Set<String> favKeys;
              private String currentCat = null;
              private int loadToken = 0;
              private boolean suppressSearch = false;

              private ListView catList, itemList;
              private TextView status, info;
              private EditText search;
              private CatAdapter catAdapter;
              private ItemAdapter itemAdapter;

              private Runnable pendingCat, pendingSearch, pendingEpg;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  x = Xtream.fromPrefs(this);
                  if (x == null) {
                      startActivity(new Intent(this, LoginActivity.class));
                      finish();
                      return;
                  }
                  kind = getIntent().getStringExtra(EXTRA_KIND);
                  if (kind == null) kind = Xtream.LIVE;
                  tv = Ui.isTv(this);
                  favKeys = Xtream.favKeys(this);
                  buildUi();
                  loadCategories();

                  String q = getIntent().getStringExtra(EXTRA_QUERY);
                  if (q != null && !q.trim().isEmpty()) {
                      search.setText(q.trim()); // triggers the search
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  main.removeCallbacksAndMessages(null);
              }

              private String kindWord(boolean plural) {
                  switch (kind) {
                      case Xtream.LIVE: return plural ? "channels" : "channel";
                      case Xtream.MOVIE: return plural ? "movies" : "movie";
                      default: return plural ? "series" : "series";
                  }
              }

              // ---------- UI ----------

              private void buildUi() {
                  int pad = tv ? Ui.dp(this, 32) : Ui.dp(this, 12);
                  boolean wide = getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Ui.BG);
                  root.setPadding(pad, pad, pad, pad);

                  // Top bar
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  root.addView(top, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView title = new TextView(this);
                  title.setText(kind.equals(Xtream.LIVE) ? "Live TV" : kind.equals(Xtream.MOVIE) ? "Movies" : "Series");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(tv ? 28 : 22);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setPadding(0, 0, Ui.dp(this, 16), 0);
                  top.addView(title);

                  search = new EditText(this);
                  search.setHint("Search " + kindWord(true) + "…");
                  search.setHintTextColor(0xFF777780);
                  search.setTextColor(Color.WHITE);
                  search.setTextSize(17);
                  search.setSingleLine(true);
                  search.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  search.setBackground(Ui.states(this, Ui.FIELD, 10));
                  search.setPadding(Ui.dp(this, 14), Ui.dp(this, 8), Ui.dp(this, 14), Ui.dp(this, 8));
                  top.addView(search, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  status = new TextView(this);
                  status.setTextColor(Ui.MUTED);
                  status.setTextSize(14);
                  status.setPadding(0, Ui.dp(this, 8), 0, Ui.dp(this, 8));
                  root.addView(status);

                  // Body: categories + items
                  LinearLayout body = new LinearLayout(this);
                  body.setOrientation(wide ? LinearLayout.HORIZONTAL : LinearLayout.VERTICAL);
                  root.addView(body, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  catList = new ListView(this);
                  catList.setDivider(null);
                  catList.setSelector(Ui.solid(this, 0xFF3A2A55, 10));
                  catList.setBackground(Ui.solid(this, Ui.SURFACE, 14));
                  catList.setPadding(Ui.dp(this, 6), Ui.dp(this, 6), Ui.dp(this, 6), Ui.dp(this, 6));
                  catList.setClipToPadding(false);
                  catAdapter = new CatAdapter();
                  catList.setAdapter(catAdapter);

                  itemList = new ListView(this);
                  itemList.setDivider(null);
                  itemList.setSelector(Ui.solid(this, Ui.ACCENT, 10));
                  itemList.setPadding(Ui.dp(this, 6), Ui.dp(this, 6), Ui.dp(this, 6), Ui.dp(this, 6));
                  itemList.setClipToPadding(false);
                  itemAdapter = new ItemAdapter();
                  itemList.setAdapter(itemAdapter);

                  if (wide) {
                      LinearLayout.LayoutParams cl = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f);
                      cl.rightMargin = Ui.dp(this, 12);
                      body.addView(catList, cl);
                      body.addView(itemList, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 2.3f));
                  } else {
                      LinearLayout.LayoutParams cl = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f);
                      cl.bottomMargin = Ui.dp(this, 10);
                      body.addView(catList, cl);
                      body.addView(itemList, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 2.2f));
                  }

                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(15);
                  info.setMaxLines(3);
                  info.setEllipsize(TextUtils.TruncateAt.END);
                  info.setPadding(0, Ui.dp(this, 10), 0, 0);
                  info.setText(kind.equals(Xtream.SERIES)
                      ? "Pick a series to see its seasons and episodes. Hold OK on one to add it to Favourites."
                      : "Hold OK (or long-press) on a " + kindWord(false)
                        + " to add it to Favourites or play it in another app.");
                  root.addView(info);

                  setContentView(root);

                  // Categories
                  catList.setOnItemClickListener((p, v, pos, id) -> {
                      clearSearchQuietly();
                      showCategory(cats.get(pos).id);
                      itemList.requestFocus();
                  });
                  catList.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(AdapterView<?> parent, View view, final int pos, long id) {
                          if (pendingCat != null) main.removeCallbacks(pendingCat);
                          pendingCat = () -> {
                              if (pos < cats.size() && !cats.get(pos).id.equals(currentCat)) {
                                  clearSearchQuietly();
                                  showCategory(cats.get(pos).id);
                              }
                          };
                          main.postDelayed(pendingCat, 450);
                      }

                      @Override
                      public void onNothingSelected(AdapterView<?> parent) {}
                  });

                  // Items
                  itemList.setOnItemClickListener((p, v, pos, id) -> openItem(pos));
                  itemList.setOnItemLongClickListener((p, v, pos, id) -> {
                      itemOptions(pos);
                      return true;
                  });
                  if (kind.equals(Xtream.LIVE)) {
                      itemList.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                          @Override
                          public void onItemSelected(AdapterView<?> parent, View view, int pos, long id) {
                              if (pos >= shown.size()) return;
                              final Xtream.Item it = shown.get(pos);
                              info.setText(it.name);
                              if (pendingEpg != null) main.removeCallbacks(pendingEpg);
                              pendingEpg = () -> epgPool.execute(() -> {
                                  final String epg = x.nowNext(it.id);
                                  main.post(() -> {
                                      int sel = itemList.getSelectedItemPosition();
                                      if (sel >= 0 && sel < shown.size() && shown.get(sel) == it) {
                                          info.setText(epg.isEmpty() ? it.name : it.name + "\n" + epg);
                                      }
                                  });
                              });
                              main.postDelayed(pendingEpg, 600);
                          }

                          @Override
                          public void onNothingSelected(AdapterView<?> parent) {}
                      });
                  }

                  // Search
                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                      public void onTextChanged(CharSequence s, int a, int b, int c) {}
                      public void afterTextChanged(Editable s) {
                          if (suppressSearch) return;
                          if (pendingSearch != null) main.removeCallbacks(pendingSearch);
                          pendingSearch = () -> runSearch(search.getText().toString().trim());
                          main.postDelayed(pendingSearch, 500);
                      }
                  });
                  search.setOnEditorActionListener((v, actionId, event) -> {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(search.getWindowToken(), 0);
                      itemList.requestFocus();
                      return true;
                  });
              }

              private void clearSearchQuietly() {
                  if (search.getText().length() == 0) return;
                  suppressSearch = true;
                  search.setText("");
                  suppressSearch = false;
              }

              private void setStatus(String s) {
                  status.setText(s);
              }

              private void setItems(List<Xtream.Item> items) {
                  shown = items;
                  itemAdapter.notifyDataSetChanged();
                  itemList.setSelection(0);
              }

              // ---------- loading ----------

              private void loadCategories() {
                  setStatus("Loading categories…");
                  bg.execute(() -> {
                      try {
                          final List<Xtream.Category> list = x.categories(kind);
                          main.post(() -> {
                              cats.clear();
                              cats.add(new Xtream.Category(FAV, "★ Favourites"));
                              cats.add(new Xtream.Category(ALL, "All " + kindWord(true)));
                              cats.addAll(list);
                              catAdapter.notifyDataSetChanged();
                              if (currentCat == null && search.getText().length() == 0) {
                                  String first;
                                  if (!Xtream.favourites(this, kind).isEmpty()) first = FAV;
                                  else if (list.isEmpty()) first = ALL;
                                  else first = list.get(0).id;
                                  showCategory(first);
                                  catList.setSelection(indexOfCat(first));
                              }
                          });
                      } catch (final Exception e) {
                          main.post(() -> setStatus(Xtream.friendly(e) + "  Hold OK on the Live TV tile to check your IPTV login."));
                      }
                  });
              }

              private int indexOfCat(String id) {
                  for (int i = 0; i < cats.size(); i++) if (cats.get(i).id.equals(id)) return i;
                  return 0;
              }

              private String catName(String id) {
                  for (Xtream.Category c : cats) if (c.id.equals(id)) return c.name;
                  return "";
              }

              private void showCategory(final String catId) {
                  currentCat = catId;
                  catAdapter.notifyDataSetChanged();
                  final int token = ++loadToken;
                  if (FAV.equals(catId)) {
                      List<Xtream.Item> favs = Xtream.favourites(this, kind);
                      setItems(favs);
                      setStatus(favs.isEmpty()
                          ? "No favourites yet. Hold OK on a " + kindWord(false) + " to add it."
                          : "Favourites · " + favs.size());
                      return;
                  }
                  setStatus("Loading " + catName(catId) + "…");
                  bg.execute(() -> {
                      try {
                          final List<Xtream.Item> items = x.items(kind, ALL.equals(catId) ? null : catId);
                          main.post(() -> {
                              if (token != loadToken) return;
                              setItems(items);
                              setStatus(catName(catId) + " · " + items.size() + " " + kindWord(items.size() != 1));
                          });
                      } catch (final Exception e) {
                          main.post(() -> {
                              if (token != loadToken) return;
                              setItems(new ArrayList<Xtream.Item>());
                              setStatus(Xtream.friendly(e));
                          });
                      }
                  });
              }

              private void runSearch(final String q) {
                  if (q.isEmpty()) {
                      showCategory(currentCat == null ? ALL : currentCat);
                      return;
                  }
                  final int token = ++loadToken;
                  setStatus("Searching all " + kindWord(true) + " for “" + q + "”… (the first search takes a moment)");
                  bg.execute(() -> {
                      try {
                          List<Xtream.Item> all = x.items(kind, null);
                          String ql = q.toLowerCase(Locale.ROOT);
                          final List<Xtream.Item> out = new ArrayList<>();
                          for (Xtream.Item i : all) {
                              if (i.name.toLowerCase(Locale.ROOT).contains(ql)) out.add(i);
                          }
                          main.post(() -> {
                              if (token != loadToken) return;
                              setItems(out);
                              setStatus(out.isEmpty()
                                  ? "No " + kindWord(true) + " match “" + q + "”."
                                  : out.size() + " " + kindWord(out.size() != 1) + " match “" + q + "”");
                          });
                      } catch (final Exception e) {
                          main.post(() -> {
                              if (token == loadToken) setStatus(Xtream.friendly(e));
                          });
                      }
                  });
              }

              // ---------- actions ----------

              private void openItem(int pos) {
                  if (pos < 0 || pos >= shown.size()) return;
                  Xtream.Item it = shown.get(pos);
                  if (kind.equals(Xtream.LIVE)) {
                      ArrayList<PlayerActivity.Entry> list = new ArrayList<>();
                      for (Xtream.Item i : shown) list.add(new PlayerActivity.Entry(i.name, x.liveUrl(i)));
                      PlayerActivity.start(this, list, pos, true);
                  } else if (kind.equals(Xtream.MOVIE)) {
                      ArrayList<PlayerActivity.Entry> list = new ArrayList<>();
                      list.add(new PlayerActivity.Entry(it.name, x.movieUrl(it)));
                      PlayerActivity.start(this, list, 0, false);
                  } else {
                      openSeries(it);
                  }
              }

              private void openSeries(final Xtream.Item it) {
                  setStatus("Loading episodes of " + it.name + "…");
                  bg.execute(() -> {
                      try {
                          final LinkedHashMap<String, List<Xtream.Episode>> s = x.seasons(it.id);
                          main.post(() -> {
                              setStatus(it.name);
                              pickSeason(it, s);
                          });
                      } catch (final Exception e) {
                          main.post(() -> setStatus(Xtream.friendly(e)));
                      }
                  });
              }

              private void pickSeason(final Xtream.Item it, final LinkedHashMap<String, List<Xtream.Episode>> seasons) {
                  if (isFinishing()) return;
                  if (seasons.isEmpty()) {
                      toast("No episodes found for " + it.name + ".");
                      return;
                  }
                  final List<String> keys = new ArrayList<>(seasons.keySet());
                  if (keys.size() == 1) {
                      pickEpisode(it, keys.get(0), seasons.get(keys.get(0)));
                      return;
                  }
                  String[] labels = new String[keys.size()];
                  for (int i = 0; i < keys.size(); i++) {
                      int n = seasons.get(keys.get(i)).size();
                      labels[i] = "Season " + keys.get(i) + "   (" + n + (n == 1 ? " episode)" : " episodes)");
                  }
                  new AlertDialog.Builder(this)
                      .setTitle(it.name)
                      .setItems(labels, (d, w) -> pickEpisode(it, keys.get(w), seasons.get(keys.get(w))))
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              private void pickEpisode(final Xtream.Item it, String season, final List<Xtream.Episode> eps) {
                  String[] labels = new String[eps.size()];
                  for (int i = 0; i < eps.size(); i++) {
                      Xtream.Episode e = eps.get(i);
                      String t = e.title == null ? "" : e.title;
                      labels[i] = "Episode " + e.num + (t.isEmpty() ? "" : "  ·  " + t);
                  }
                  new AlertDialog.Builder(this)
                      .setTitle(it.name + " · Season " + season)
                      .setItems(labels, (d, w) -> {
                          ArrayList<PlayerActivity.Entry> list = new ArrayList<>();
                          for (Xtream.Episode e : eps) {
                              list.add(new PlayerActivity.Entry(it.name + " · S" + e.season + " E" + e.num, x.episodeUrl(e)));
                          }
                          PlayerActivity.start(this, list, w, false);
                      })
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              private void itemOptions(int pos) {
                  if (pos < 0 || pos >= shown.size()) return;
                  final Xtream.Item it = shown.get(pos);
                  boolean fav = favKeys.contains(it.key());
                  List<String> opts = new ArrayList<>();
                  opts.add(fav ? "Remove from Favourites" : "Add to Favourites");
                  if (!kind.equals(Xtream.SERIES)) opts.add("Play in another app (VLC, MX Player…)");
                  new AlertDialog.Builder(this)
                      .setTitle(it.name)
                      .setItems(opts.toArray(new String[0]), (d, w) -> {
                          if (w == 0) {
                              boolean now = Xtream.toggleFav(this, it);
                              favKeys = Xtream.favKeys(this);
                              toast(now ? "Added to Favourites" : "Removed from Favourites");
                              if (FAV.equals(currentCat) && search.getText().length() == 0) showCategory(FAV);
                              else itemAdapter.notifyDataSetChanged();
                          } else {
                              playExternal(it);
                          }
                      })
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              private void playExternal(Xtream.Item it) {
                  String url = kind.equals(Xtream.LIVE) ? x.liveUrl(it) : x.movieUrl(it);
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(Uri.parse(url), "video/*");
                  i.putExtra("title", it.name);
                  try {
                      startActivity(Intent.createChooser(i, "Play with"));
                  } catch (Exception e) {
                      toast("No other video player is installed.");
                  }
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }

              // ---------- adapters ----------

              private class CatAdapter extends BaseAdapter {
                  @Override public int getCount() { return cats.size(); }
                  @Override public Object getItem(int p) { return cats.get(p); }
                  @Override public long getItemId(int p) { return p; }

                  @Override
                  public View getView(int p, View convert, ViewGroup parent) {
                      TextView t = convert instanceof TextView ? (TextView) convert : new TextView(IptvActivity.this);
                      Xtream.Category c = cats.get(p);
                      t.setText(c.name);
                      boolean current = c.id.equals(currentCat);
                      t.setTextColor(current ? 0xFFD9B8FF : Color.WHITE);
                      t.setTypeface(current ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                      t.setTextSize(tv ? 18 : 16);
                      t.setSingleLine(true);
                      t.setEllipsize(TextUtils.TruncateAt.END);
                      t.setPadding(Ui.dp(IptvActivity.this, 14), Ui.dp(IptvActivity.this, 10),
                          Ui.dp(IptvActivity.this, 14), Ui.dp(IptvActivity.this, 10));
                      return t;
                  }
              }

              private class ItemAdapter extends BaseAdapter {
                  @Override public int getCount() { return shown.size(); }
                  @Override public Object getItem(int p) { return shown.get(p); }
                  @Override public long getItemId(int p) { return p; }

                  @Override
                  public View getView(int p, View convert, ViewGroup parent) {
                      LinearLayout row;
                      ImageView img;
                      TextView name;
                      boolean live = kind.equals(Xtream.LIVE);
                      int w = live ? Ui.dp(IptvActivity.this, tv ? 72 : 60) : Ui.dp(IptvActivity.this, tv ? 54 : 44);
                      int h = live ? Ui.dp(IptvActivity.this, tv ? 44 : 36) : Ui.dp(IptvActivity.this, tv ? 80 : 66);
                      if (convert instanceof LinearLayout) {
                          row = (LinearLayout) convert;
                          img = (ImageView) row.getChildAt(0);
                          name = (TextView) row.getChildAt(1);
                      } else {
                          row = new LinearLayout(IptvActivity.this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          int pd = Ui.dp(IptvActivity.this, 8);
                          row.setPadding(pd, pd / 2, pd, pd / 2);
                          img = new ImageView(IptvActivity.this);
                          img.setScaleType(live ? ImageView.ScaleType.FIT_CENTER : ImageView.ScaleType.CENTER_CROP);
                          img.setBackground(Ui.solid(IptvActivity.this, Ui.SURFACE, 6));
                          LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(w, h);
                          ip.rightMargin = Ui.dp(IptvActivity.this, 14);
                          row.addView(img, ip);
                          name = new TextView(IptvActivity.this);
                          name.setTextColor(Color.WHITE);
                          name.setTextSize(tv ? 19 : 16);
                          name.setMaxLines(2);
                          name.setEllipsize(TextUtils.TruncateAt.END);
                          row.addView(name, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                      }
                      Xtream.Item it = shown.get(p);
                      String prefix = live ? (p + 1) + ".  " : "";
                      name.setText((favKeys.contains(it.key()) ? "★ " : "") + prefix + it.name);
                      ImageLoader.load(img, it.icon, Math.max(w, h));
                      return row;
                  }
              }
          }
