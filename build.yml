                  play();
              }

              private static String key(Entry e) {
                  return "pos_" + e.url.hashCode();
              }

              private void play() {
                  Entry e = queue.get(index);
                  MediaItem.Builder b = new MediaItem.Builder().setUri(e.url);
                  if (e.url.contains(".m3u8")) b.setMimeType(MimeTypes.APPLICATION_M3U8);
                  player.setMediaItem(b.build());
                  if (!live) {
                      long pos = resume.getLong(key(e), 0);
                      if (pos > 0) player.seekTo(pos);
                  }
                  player.prepare();
                  player.setPlayWhenReady(true);
                  String counter = live && queue.size() > 1 ? "     " + (index + 1) + " / " + queue.size() : "";
                  showOverlay(e.title + counter, 4000);
              }

              private void savePosition() {
                  if (player == null || live) return;
                  Entry e = queue.get(index);
                  long pos = player.getCurrentPosition();
                  long dur = player.getDuration();
                  if (dur != C.TIME_UNSET && pos > 30000 && pos < dur - 120000) {
                      resume.edit().putLong(key(e), pos).apply();
                  } else if (dur != C.TIME_UNSET && pos >= dur - 120000) {
                      resume.edit().remove(key(e)).apply();
                  }
              }

              private void releasePlayer() {
                  if (player == null) return;
                  savePosition();
                  view.setPlayer(null);
                  player.release();
                  player = null;
              }

              private void showOverlay(String text, long ms) {
                  overlay.setText(text);
                  overlay.setVisibility(View.VISIBLE);
                  h.removeCallbacks(hideOverlay);
                  h.postDelayed(hideOverlay, ms);
              }

              private void switchBy(int d) {
                  if (player == null || queue.size() < 2) return;
                  index = (index + d + queue.size()) % queue.size();
                  play();
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent ev) {
                  if (live && queue.size() > 1 && ev.getAction() == KeyEvent.ACTION_DOWN) {
                      int k = ev.getKeyCode();
                      boolean controls = view != null && view.isControllerFullyVisible();
                      if (k == KeyEvent.KEYCODE_CHANNEL_UP || (!controls && k == KeyEvent.KEYCODE_DPAD_UP)) {
                          switchBy(1);
                          return true;
                      }
                      if (k == KeyEvent.KEYCODE_CHANNEL_DOWN || (!controls && k == KeyEvent.KEYCODE_DPAD_DOWN)) {
                          switchBy(-1);
                          return true;
                      }
                  }
                  return super.dispatchKeyEvent(ev);
              }
          }
