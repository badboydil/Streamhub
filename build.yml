          package com.dil.streamhub;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.LruCache;
          import android.widget.ImageView;

          import java.io.BufferedInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Tiny poster/logo loader with a memory cache. */
          final class ImageLoader {
              private static final ExecutorService POOL = Executors.newFixedThreadPool(4);
              private static final Handler MAIN = new Handler(Looper.getMainLooper());
              private static final Set<String> FAILED = Collections.synchronizedSet(new HashSet<String>());
              private static final LruCache<String, Bitmap> CACHE =
                  new LruCache<String, Bitmap>((int) Math.min(Runtime.getRuntime().maxMemory() / 8, 24L * 1024 * 1024)) {
                      @Override
                      protected int sizeOf(String key, Bitmap b) {
                          return b.getByteCount();
                      }
                  };

              private ImageLoader() {}

              static void load(final ImageView v, final String url, final int targetPx) {
                  v.setTag(url);
                  v.setImageDrawable(null);
                  if (url == null || url.isEmpty() || FAILED.contains(url)) return;
                  Bitmap cached = CACHE.get(url);
                  if (cached != null) {
                      v.setImageBitmap(cached);
                      return;
                  }
                  POOL.execute(() -> {
                      if (!url.equals(v.getTag())) return; // row was reused before we started
                      final Bitmap bmp = fetch(url, targetPx);
                      if (bmp == null) {
                          FAILED.add(url);
                          return;
                      }
                      CACHE.put(url, bmp);
                      MAIN.post(() -> {
                          if (url.equals(v.getTag())) v.setImageBitmap(bmp);
                      });
                  });
              }

              private static Bitmap fetch(String url, int target) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(12000);
                      c.setRequestProperty("User-Agent", Xtream.UA);
                      c.setInstanceFollowRedirects(true);
                      if (c.getResponseCode() >= 400) return null;
                      InputStream in = new BufferedInputStream(c.getInputStream());
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n, total = 0;
                      while ((n = in.read(buf)) > 0) {
                          o.write(buf, 0, n);
                          total += n;
                          if (total > 4 * 1024 * 1024) { in.close(); return null; }
                      }
                      in.close();
                      byte[] data = o.toByteArray();
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(data, 0, data.length, bounds);
                      if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null;
                      int sample = 1;
                      while (bounds.outWidth / (sample * 2) >= target && bounds.outHeight / (sample * 2) >= target) sample *= 2;
                      BitmapFactory.Options opt = new BitmapFactory.Options();
                      opt.inSampleSize = sample;
                      return BitmapFactory.decodeByteArray(data, 0, data.length, opt);
                  } catch (Throwable t) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }
