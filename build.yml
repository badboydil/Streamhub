              private EditText field(LinearLayout root, String label, String hint, int variation) {
                  TextView l = new TextView(this);
                  l.setText(label);
                  l.setTextColor(Ui.MUTED);
                  l.setTextSize(14);
                  l.setPadding(0, Ui.dp(this, 8), 0, Ui.dp(this, 4));
                  root.addView(l);

                  EditText e = new EditText(this);
                  e.setSingleLine(true);
                  e.setHint(hint);
                  e.setHintTextColor(0xFF666670);
                  e.setTextColor(Color.WHITE);
                  e.setTextSize(18);
                  e.setInputType(InputType.TYPE_CLASS_TEXT | variation);
                  e.setBackground(Ui.states(this, Ui.FIELD, 10));
                  e.setPadding(Ui.dp(this, 14), Ui.dp(this, 10), Ui.dp(this, 14), Ui.dp(this, 10));
                  root.addView(e, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return e;
              }

              private void check() {
                  String s = server.getText().toString().trim();
                  String u = user.getText().toString().trim();
                  String p = pass.getText().toString().trim();

                  // Accept a full M3U / player_api link and pull the login out of it.
                  if (s.contains("username=")) {
                      try {
                          Uri link = Uri.parse(s.startsWith("http") ? s : "http://" + s);
                          String lu = link.getQueryParameter("username");
                          String lp = link.getQueryParameter("password");
                          if (lu != null) { u = lu; user.setText(lu); }
                          if (lp != null) { p = lp; pass.setText(lp); }
                          s = Xtream.normalize(s);
                          server.setText(s);
                      } catch (Exception ignored) {}
                  }

                  if (s.isEmpty() || u.isEmpty()) {
                      status.setText("Enter the server address and your username first.");
                      return;
                  }

                  final Xtream x = new Xtream(s, u, p, hls.isChecked());
                  status.setText("Checking your login…");
                  save.setEnabled(false);
                  new Thread(() -> {
                      String msg;
                      boolean ok = false;
                      try {
                          Xtream.Account a = x.login();
                          if (a.ok) {
                              x.save(this);
                              ok = true;
                              StringBuilder b = new StringBuilder("Connected ✓");
                              if (!a.status.isEmpty()) b.append("\nAccount: ").append(a.status);
                              if (!a.expires.isEmpty()) b.append("\nValid until: ").append(a.expires);
                              if (!a.maxConn.isEmpty()) b.append("\nScreens at once: ").append(a.maxConn);
                              b.append("\n\nPress Done to go back. The Live TV, Movies and Series tiles now use this login.");
                              msg = b.toString();
                          } else {
                              msg = a.message;
                          }
                      } catch (Exception e) {
                          msg = Xtream.friendly(e);
                      }
                      final String m = msg;
                      final boolean success = ok;
                      runOnUiThread(() -> {
                          save.setEnabled(true);
                          status.setText(m);
                          if (success) setResult(RESULT_OK);
                      });
                  }).start();
              }
          }
