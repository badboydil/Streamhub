          mkdir -p app/src/main/java/com/dil/streamhub
          cat > app/src/main/java/com/dil/streamhub/MainActivity.java <<'STREAMHUB_EOF'
          package com.dil.streamhub;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.SearchManager;
          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              static class Service {
                  final String id, name;
                  final int bg, fg;
                  final String[] pkgs;

                  Service(String id, String name, int bg, int fg, String[] pkgs) {
                      this.id = id; this.name = name; this.bg = bg; this.fg = fg; this.pkgs = pkgs;
                  }
              }

              static class AppEntry {
                  final String label, pkg;
                  AppEntry(String label, String pkg) { this.label = label; this.pkg = pkg; }
              }

              private static final Service[] SERVICES = {
                  new Service("netflix", "Netflix", 0xFF141414, 0xFFE50914,
                      new String[]{"com.netflix.ninja", "com.netflix.mediaclient"}),
                  new Service("prime", "Prime Video", 0xFF00A8E1, Color.WHITE,
                      new String[]{"com.amazon.firebat", "com.amazon.amazonvideo.livingroom",
                          "com.amazon.avod.thirdpartyclient", "com.amazon.avod"}),
                  new Service("youtube", "YouTube", 0xFFFF0033, Color.WHITE,
                      new String[]{"com.google.android.youtube.tv", "com.amazon.firetv.youtube",
                          "com.google.android.youtube"}),
                  new Service("live", "Live TV", 0xFF6A1B9A, Color.WHITE,
                      new String[]{"com.nathnetwork.xciptv"}),
              };

              private SharedPreferences prefs;
              private PackageManager pm;
              private boolean tv;

              private EditText search;
              private LinearLayout tileArea;
              private LinearLayout listRow;
              private final List<View> tiles = new ArrayList<>();
              private final List<TextView> tileStatus = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("hub", MODE_PRIVATE);
                  pm = getPackageManager();
                  UiModeManager ui = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                  tv = ui != null && ui.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
                  buildUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshTiles();
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  buildTiles();
                  refreshTiles();
              }

              // ---------- UI ----------

              private int dp(float v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private StateListDrawable bgStates(int color, float radiusDp) {
                  GradientDrawable normal = new GradientDrawable();
                  normal.setColor(color);
                  normal.setCornerRadius(dp(radiusDp));
                  GradientDrawable focused = new GradientDrawable();
                  focused.setColor(color);
                  focused.setCornerRadius(dp(radiusDp));
                  focused.setStroke(dp(4), Color.WHITE);
                  StateListDrawable s = new StateListDrawable();
                  s.addState(new int[]{android.R.attr.state_focused}, focused);
                  s.addState(new int[]{android.R.attr.state_pressed}, focused);
                  s.addState(new int[]{}, normal);
                  return s;
              }

              private void growOnFocus(View v, float scale) {
                  v.setOnFocusChangeListener((view, has) ->
                      view.animate().scaleX(has ? scale : 1f).scaleY(has ? scale : 1f).setDuration(120).start());
              }

              private Button smallButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(16);
                  b.setBackground(bgStates(0xFF2A2A33, 12));
                  b.setPadding(dp(18), dp(10), dp(18), dp(10));
                  growOnFocus(b, 1.05f);
                  return b;
              }

              private void buildUi() {
                  int pad = tv ? dp(40) : dp(16);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(0xFF0E0E12);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);
                  root.setClipChildren(false);
                  root.setClipToPadding(false);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("StreamHub");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(tv ? 34 : 28);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("Netflix, Prime Video, YouTube and Live TV in one place");
                  sub.setTextColor(0xFFA0A0AA);
                  sub.setTextSize(15);
                  sub.setPadding(0, dp(2), 0, dp(18));
                  root.addView(sub);

                  // Search row
                  LinearLayout searchRow = new LinearLayout(this);
                  searchRow.setOrientation(LinearLayout.HORIZONTAL);
                  searchRow.setGravity(Gravity.CENTER_VERTICAL);
                  root.addView(searchRow, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  search = new EditText(this);
                  search.setId(R.id.search_box);
                  search.setHint("Search a movie or series…");
                  search.setHintTextColor(0xFF777780);
                  search.setTextColor(Color.WHITE);
                  search.setTextSize(18);
                  search.setSingleLine(true);
                  search.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  search.setBackground(bgStates(0xFF22222A, 12));
                  search.setPadding(dp(16), dp(12), dp(16), dp(12));
                  searchRow.addView(search, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button clear = smallButton("Clear");
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  blp.leftMargin = dp(10);
                  searchRow.addView(clear, blp);

                  Button save = smallButton("+ My List");
                  searchRow.addView(save, new LinearLayout.LayoutParams(blp));

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                      public void onTextChanged(CharSequence s, int a, int b, int c) {}
                      public void afterTextChanged(Editable s) { refreshTiles(); }
                  });
                  search.setOnEditorActionListener((v, actionId, event) -> {
                      hideKeyboard();
                      if (!tiles.isEmpty()) tiles.get(0).requestFocus();
                      return true;
                  });
                  clear.setOnClickListener(v -> {
                      search.setText("");
                      if (!tiles.isEmpty()) tiles.get(0).requestFocus();
                  });
                  save.setOnClickListener(v -> addToList(query()));

                  // Tiles
                  tileArea = new LinearLayout(this);
                  tileArea.setOrientation(LinearLayout.VERTICAL);
                  tileArea.setClipChildren(false);
                  tileArea.setPadding(0, dp(18), 0, dp(10));
                  root.addView(tileArea, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  buildTiles();

                  // My List
                  TextView listTitle = new TextView(this);
                  listTitle.setText("My List");
                  listTitle.setTextColor(Color.WHITE);
                  listTitle.setTextSize(20);
                  listTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  listTitle.setPadding(0, dp(12), 0, dp(8));
                  root.addView(listTitle);

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setClipChildren(false);
                  listRow = new LinearLayout(this);
                  listRow.setOrientation(LinearLayout.HORIZONTAL);
                  listRow.setClipChildren(false);
                  listRow.setPadding(dp(4), dp(6), dp(4), dp(6));
                  hs.addView(listRow);
                  root.addView(hs);
                  rebuildList();

                  TextView tip = new TextView(this);
                  tip.setText("Tips: type a title, then pick a tile to search that app.  "
                      + "Hold OK (or long-press) on a tile to choose which app it opens.  "
                      + "Hold a My List title to remove it.");
                  tip.setTextColor(0xFF808088);
                  tip.setTextSize(13);
                  tip.setPadding(0, dp(20), 0, 0);
                  root.addView(tip);

                  setContentView(scroll);
                  if (!tiles.isEmpty()) tiles.get(0).requestFocus();
              }

              private void buildTiles() {
                  if (tileArea == null) return;
                  tileArea.removeAllViews();
                  tiles.clear();
                  tileStatus.clear();

                  boolean wide = getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE;
                  int cols = wide ? 4 : 2;
                  int height = tv ? dp(170) : dp(130);

                  LinearLayout row = null;
                  for (int i = 0; i < SERVICES.length; i++) {
                      if (i % cols == 0) {
                          row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setClipChildren(false);
                          tileArea.addView(row, new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                      }
                      final Service s = SERVICES[i];

                      LinearLayout tile = new LinearLayout(this);
                      tile.setOrientation(LinearLayout.VERTICAL);
                      tile.setGravity(Gravity.CENTER);
                      tile.setFocusable(true);
                      tile.setClickable(true);
                      tile.setBackground(bgStates(s.bg, 18));
                      tile.setPadding(dp(12), dp(12), dp(12), dp(12));
                      growOnFocus(tile, 1.07f);

                      TextView name = new TextView(this);
                      name.setText(s.name);
                      name.setTextColor(s.fg);
                      name.setTextSize(tv ? 28 : 22);
                      name.setTypeface(Typeface.DEFAULT_BOLD);
                      name.setGravity(Gravity.CENTER);
                      tile.addView(name);

                      TextView status = new TextView(this);
                      status.setTextColor(0xDDFFFFFF);
                      status.setTextSize(14);
                      status.setGravity(Gravity.CENTER);
                      status.setPadding(0, dp(6), 0, 0);
                      status.setMaxLines(2);
                      tile.addView(status);

                      tile.setOnClickListener(v -> openService(s));
                      tile.setOnLongClickListener(v -> { pickApp(s); return true; });

                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, height, 1f);
                      lp.setMargins(dp(8), dp(8), dp(8), dp(8));
                      row.addView(tile, lp);
                      tiles.add(tile);
                      tileStatus.add(status);
                  }
                  // pad an incomplete last row so tiles keep the same width
                  int rem = SERVICES.length % cols;
                  if (rem != 0 && row != null) {
                      for (int i = rem; i < cols; i++) {
                          View spacer = new View(this);
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, height, 1f);
                          lp.setMargins(dp(8), dp(8), dp(8), dp(8));
                          row.addView(spacer, lp);
                      }
                  }
              }

              private void refreshTiles() {
                  if (search == null) return;
                  String q = query();
                  for (int i = 0; i < SERVICES.length && i < tileStatus.size(); i++) {
                      Service s = SERVICES[i];
                      String pkg = resolvePkg(s);
                      String text;
                      if (pkg == null) {
                          text = "Not found – hold OK to choose the app";
                      } else if (q.isEmpty() || s.id.equals("live")) {
                          text = "Open";
                      } else {
                          text = "Search “" + q + "”";
                      }
                      tileStatus.get(i).setText(text);
                  }
              }

              private void hideKeyboard() {
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null && search != null) imm.hideSoftInputFromWindow(search.getWindowToken(), 0);
              }

              private String query() {
                  return search == null ? "" : search.getText().toString().trim();
              }

              // ---------- My List ----------

              private List<String> loadList() {
                  List<String> out = new ArrayList<>();
                  String raw = prefs.getString("mylist", "");
                  for (String line : raw.split("\n")) {
                      if (!line.trim().isEmpty()) out.add(line.trim());
                  }
                  return out;
              }

              private void saveList(List<String> list) {
                  StringBuilder sb = new StringBuilder();
                  for (String s : list) {
                      if (sb.length() > 0) sb.append('\n');
                      sb.append(s);
                  }
                  prefs.edit().putString("mylist", sb.toString()).apply();
              }

              private void addToList(String title) {
                  if (title.isEmpty()) {
                      toast("Type a title first, then press + My List");
                      return;
                  }
                  List<String> list = loadList();
                  for (String s : list) {
                      if (s.equalsIgnoreCase(title)) { toast("Already in My List"); return; }
                  }
                  list.add(0, title);
                  saveList(list);
                  rebuildList();
                  toast("Added “" + title + "” to My List");
              }

              private void rebuildList() {
                  listRow.removeAllViews();
                  List<String> list = loadList();
                  if (list.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText("Nothing saved yet. Type a title above and press + My List.");
                      empty.setTextColor(0xFF808088);
                      empty.setTextSize(15);
                      listRow.addView(empty);
                      return;
                  }
                  for (final String t : list) {
                      Button chip = smallButton(t);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.rightMargin = dp(10);
                      chip.setOnClickListener(v -> {
                          search.setText(t);
                          search.setSelection(t.length());
                          if (!tiles.isEmpty()) tiles.get(0).requestFocus();
                      });
                      chip.setOnLongClickListener(v -> {
                          List<String> l = loadList();
                          l.remove(t);
                          saveList(l);
                          rebuildList();
                          toast("Removed “" + t + "”");
                          return true;
                      });
                      listRow.addView(chip, lp);
                  }
              }

              // ---------- Apps ----------

              private Intent launchIntent(String pkg) {
                  if (pkg == null) return null;
                  Intent i = null;
                  try {
                      if (tv) i = pm.getLeanbackLaunchIntentForPackage(pkg);
                      if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                      if (i == null) i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  } catch (Exception ignored) {}
                  return i;
              }

              private boolean installed(String pkg) {
                  return launchIntent(pkg) != null;
              }

              private List<AppEntry> launchableApps() {
                  Map<String, String> found = new LinkedHashMap<>();
                  String[] cats = {Intent.CATEGORY_LAUNCHER, Intent.CATEGORY_LEANBACK_LAUNCHER};
                  for (String cat : cats) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String pkg = ri.activityInfo.packageName;
                          if (pkg.equals(getPackageName()) || found.containsKey(pkg)) continue;
                          found.put(pkg, String.valueOf(ri.loadLabel(pm)));
                      }
                  }
                  List<AppEntry> apps = new ArrayList<>();
                  for (Map.Entry<String, String> e : found.entrySet()) apps.add(new AppEntry(e.getValue(), e.getKey()));
                  Collections.sort(apps, (a, b) -> a.label.compareToIgnoreCase(b.label));
                  return apps;
              }

              private String findLiveTvApp() {
                  for (String p : SERVICES[3].pkgs) if (installed(p)) return p;
                  List<AppEntry> apps = launchableApps();
                  String[] words = {"muk", "xc", "iptv", "smarters", "tivimate"};
                  for (String w : words) {
                      for (AppEntry a : apps) {
                          String l = a.label.toLowerCase(Locale.ROOT);
                          String p = a.pkg.toLowerCase(Locale.ROOT);
                          if (l.contains(w) || p.contains(w)) return a.pkg;
                      }
                  }
                  return null;
              }

              private String resolvePkg(Service s) {
                  String saved = prefs.getString("app_" + s.id, null);
                  if (saved != null && installed(saved)) return saved;
                  for (String p : s.pkgs) if (installed(p)) return p;
                  if (s.id.equals("live")) return findLiveTvApp();
                  return null;
              }

              private void pickApp(final Service s) {
                  final List<AppEntry> apps = launchableApps();
                  String[] labels = new String[apps.size()];
                  for (int i = 0; i < apps.size(); i++) labels[i] = apps.get(i).label;
                  new AlertDialog.Builder(this)
                      .setTitle("Which app should “" + s.name + "” open?")
                      .setItems(labels, (d, which) -> {
                          prefs.edit().putString("app_" + s.id, apps.get(which).pkg).apply();
                          refreshTiles();
                          toast(s.name + " will open " + apps.get(which).label);
                      })
                      .setNeutralButton("Auto-detect", (d, w) -> {
                          prefs.edit().remove("app_" + s.id).apply();
                          refreshTiles();
                      })
                      .setNegativeButton("Cancel", null)
                      .show();
              }

              private boolean startFirst(List<Intent> options) {
                  for (Intent i : options) {
                      if (i == null) continue;
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          if (i.resolveActivity(pm) != null) {
                              startActivity(i);
                              return true;
                          }
                      } catch (Exception ignored) {}
                  }
                  return false;
              }

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              private Intent view(String url, String pkg) {
                  return new Intent(Intent.ACTION_VIEW, Uri.parse(url)).setPackage(pkg);
              }

              private Intent searchIntent(String q, String pkg) {
                  Intent i = new Intent(Intent.ACTION_SEARCH).setPackage(pkg);
                  i.putExtra(SearchManager.QUERY, q);
                  i.putExtra("query", q);
                  return i;
              }

              private void openService(Service s) {
                  String pkg = resolvePkg(s);
                  if (pkg == null) {
                      toast(s.name + " app not found. Choose which app to use.");
                      pickApp(s);
                      return;
                  }
                  String q = query();
                  if (q.isEmpty() || s.id.equals("live")) {
                      if (!startFirst(Collections.singletonList(launchIntent(pkg)))) toast("Couldn't open " + s.name);
                      return;
                  }

                  List<Intent> tries = new ArrayList<>();
                  switch (s.id) {
                      case "youtube":
                          tries.add(searchIntent(q, pkg));
                          tries.add(view("https://www.youtube.com/results?search_query=" + enc(q), pkg));
                          break;
                      case "netflix":
                          tries.add(view("https://www.netflix.com/search?q=" + enc(q), pkg));
                          tries.add(searchIntent(q, pkg));
                          break;
                      case "prime":
                          tries.add(searchIntent(q, pkg));
                          tries.add(view("https://app.primevideo.com/search?phrase=" + enc(q), pkg));
                          break;
                      default:
                          tries.add(searchIntent(q, pkg));
                  }
                  if (startFirst(tries)) return;

                  if (startFirst(Collections.singletonList(launchIntent(pkg)))) {
                      toast("Opened " + s.name + " – search for “" + q + "” there");
                  } else {
                      toast("Couldn't open " + s.name);
                  }
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
              }
          }
