name: Build StreamHub

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Write the app files
        run: |
          mkdir -p app
          cat > app/build.gradle <<'STREAMHUB_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dil.streamhub'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dil.streamhub'
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  hub {
                      storeFile file('hub.jks')
                      storePassword 'streamhub'
                      keyAlias 'hub'
                      keyPassword 'streamhub'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.hub
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          STREAMHUB_EOF
          mkdir -p app
